appId: org.munhae.studio
productName: Munhae Studio
copyright: Copyright © 2026 Munhae
asar: true
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
npmRebuild: true
fileAssociations:
  - ext: munhae
    name: Munhae Project
    description: Munhae Studio project
    role: Editor
    isPackage: true
  - ext: munhaepkg
    name: Munhae Backup
    description: Munhae Studio backup
    role: Editor
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: false
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
linux:
  target:
    - AppImage
  category: Office
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraMetadata:
  main: out/main/index.js
