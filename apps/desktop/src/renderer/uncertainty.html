<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; font-src 'self'; connect-src 'self'">
<title data-i18n="불확실성 — 문해 Munhae Studio">불확실성 — 문해 Munhae Studio</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/chrome.css">
<link rel="stylesheet" href="./styles/knowledge.css">
<script type="module" blocking="render" src="./scripts/app-entry.ts"></script>
</head>
<body data-auth-pending class="materials-hub" data-knowledge-page="uncertainty">

<div class="win" id="win" data-od-id="app-window">
  <aside class="sidebar" id="sidebar" data-od-id="sidebar" aria-label="탐색" data-i18n-aria-label="탐색">
    <div class="sb-top"><div class="tl" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div></div>
    <div class="sb-scroll" id="sbTree"></div>
    <div class="sb-foot"><a class="sb-account" href="settings.html#account" aria-label="계정 설정 열기" data-i18n-aria-label="계정 설정 열기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14v-1a5 5 0 0 1 10 0v1"/></svg><span class="sb-account-label" data-i18n="문해 계정">문해 계정</span></a></div>
  </aside>

  <div class="main">
    <header class="titlebar" data-od-id="titlebar">
      <div class="tl" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="tb-l"><button class="tb is-on" id="tbSidebar" title="사이드바 (⌃⌘S)" data-i18n-title="사이드바 (⌃⌘S)" aria-label="사이드바 토글" data-i18n-aria-label="사이드바 토글"></button></div>
      <div class="tb-c">
        <span data-i18n="불확실성">불확실성</span>
      </div>
      <div class="tb-r"><button class="tb is-on" id="tbInsp" title="검사기 (⌥⌘I)" aria-label="검사기 토글" data-i18n-title="검사기 (⌥⌘I)" data-i18n-aria-label="검사기 토글"></button></div>
    </header>

    <div class="content materials-content">
      <header class="materials-heading">
        <div class="materials-title-row">
          <div class="materials-title-group">
            <h1 data-i18n="불확실성">불확실성</h1>
            <p class="materials-project" id="materialsProject"></p>
          </div>
          <button class="btn btn-primary" id="btnAdd" type="button" data-od-id="btn-add-entry" data-i18n="불확실성 추가">불확실성 추가</button>
        </div>
      </header>
      <div class="scope" id="scopeBar">
        <span class="sp"></span>
        <span class="muted" id="scopeNote" data-i18n="문서와 구절에 남긴 미해결 해석·근거·대안을 관리합니다">문서와 구절에 남긴 미해결 해석·근거·대안을 관리합니다</span>
      </div>

      <div class="split" id="split">
        <div class="tbl-wrap">
          <section data-od-id="uncertainty-table">
            <table class="tbl"><thead><tr><th>ID</th><th data-i18n="진술">진술</th><th data-i18n="범주">범주</th><th data-i18n="위치">위치</th><th data-i18n="상태">상태</th></tr></thead><tbody id="uBody"></tbody></table>
          </section>
        </div>

        <aside class="insp" id="insp" data-od-id="inspector" aria-label="검사기" data-i18n-aria-label="검사기">
          <div class="materials-detail-top"><span id="detailMeta" data-i18n="자료를 선택하세요">자료를 선택하세요</span></div>
          <div id="detail" class="materials-detail"><div class="materials-empty-detail"><span aria-hidden="true">文</span><h2><span data-i18n="배경과 판단을">배경과 판단을</span><br><span data-i18n="번역 곁에.">번역 곁에.</span></h2><p><span data-i18n="항목을 선택하면 내용을 보고 편집할 수 있습니다.">항목을 선택하면 내용을 보고 편집할 수 있습니다.</span></p></div></div>
        </aside>
      </div>
    </div>
  </div>

  <footer class="statusbar" data-od-id="statusbar">
    <span class="mono" id="sbPath"></span>
    <span><span data-i18n="자료 ">자료 </span><b id="sbC">0</b><span data-i18n=" · 용어 "> · 용어 </span><b id="sbG">0</b><span data-i18n=" · 불확실성 열림 "> · 불확실성 열림 </span><b id="sbU">0</b></span>
    <span class="sp"></span>
    <span id="sbSel"></span>
    <span id="sbAgent"><i class="dot"></i>AI</span>
    <button id="sbPalette" type="button" title="명령 검색" data-i18n-title="명령 검색">⌘K</button>
  </footer>
</div>

<div class="notif" id="notif" role="status" aria-live="polite"><div class="ai" aria-hidden="true">文</div><div><b id="nTitle" data-i18n="문해">문해</b><span id="nMsg"></span></div></div>

<dialog id="dlgAdd" data-od-id="dialog-add-entry">
  <form method="dialog" id="addForm">
    <div class="dl-h" id="addTitle" data-i18n="용어 추가">용어 추가</div>
    <div class="dl-b" id="addFields"></div>
    <div class="dl-f"><button class="btn" type="button" id="addCancel" data-i18n="취소">취소</button><button class="btn btn-primary" type="submit" data-i18n="추가">추가</button></div>
  </form>
</dialog>
<dialog id="dlgPalette" class="palette" data-od-id="command-palette">
  <input class="input" id="palIn" placeholder="명령 검색…" data-i18n-placeholder="명령 검색…" aria-label="명령 검색" data-i18n-aria-label="명령 검색">
  <div class="pl-list" id="palList"></div>
</dialog>

</body>
</html>
