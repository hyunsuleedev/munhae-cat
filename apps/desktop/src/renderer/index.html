<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; font-src 'self'; connect-src 'self'">
<title data-i18n="문해 Munhae Studio — 시작">문해 Munhae Studio — 시작</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/chrome.css">
<link rel="stylesheet" href="./styles/welcome.css">
<link rel="stylesheet" href="./styles/online-projects.css">
<script type="module" blocking="render" src="./scripts/app-entry.ts"></script>
</head>
<body data-auth-pending class="welcome-page">
<div class="welcome-drag" aria-hidden="true"></div>

<main class="welcome" data-od-id="welcome-window" aria-label="문해 시작" data-i18n-aria-label="문해 시작">
  <section class="w-left" data-od-id="welcome-actions">
    <h1 class="munhae-brand" aria-label="문해 Munhae Studio" data-i18n-aria-label="문해 Munhae Studio"><strong aria-hidden="true">文解</strong><small aria-hidden="true">MUNHAE<br>STUDIO</small></h1>
    <p class="ver" id="verLine" data-i18n="버전 0.1.4">버전 0.1.4</p>
    <div class="welcome-account" id="welcomeAccount"><span id="welcomeAccountLabel" data-i18n="문해 계정">문해 계정</span><a class="btn btn-primary" id="welcomeAccountLink" href="account.html" data-i18n="로그인">로그인</a><a class="btn" id="welcomeSignUpLink" href="account.html?mode=signup" data-i18n="회원가입">회원가입</a></div>
    <div class="w-actions">
      <button class="w-act" type="button" data-cmd="newproj" data-od-id="action-new-project"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M8 5.5v5M5.5 8h5"/></svg><div><b data-i18n="로컬 프로젝트 만들기">로컬 프로젝트 만들기</b><span data-i18n="이 컴퓨터에 .munhae 파일로 저장">이 컴퓨터에 .munhae 파일로 저장</span></div><kbd>⇧⌘N</kbd></button>
      <button class="w-act" type="button" id="btnCreateOnlineProject" data-od-id="action-new-online-project" disabled><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 12.5H12a2.75 2.75 0 0 0 .4-5.47A4.5 4.5 0 0 0 3.6 6a3.3 3.3 0 0 0 .9 6.5Z"/><path d="M8 6.5v4M6 8.5h4"/></svg><div><b data-i18n="온라인 프로젝트 만들기">온라인 프로젝트 만들기</b><span data-i18n="문해 계정에 온라인으로 저장">문해 계정에 온라인으로 저장</span></div></button>
      <button class="w-act" type="button" data-cmd="open" data-od-id="action-open-project"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h4.2l1.5 1.5H14V13H2z"/></svg><div><b data-i18n="기존 프로젝트 열기…">기존 프로젝트 열기…</b><span data-i18n=".munhae 또는 .munhaepkg 백업에서 복원">.munhae 또는 .munhaepkg 백업에서 복원</span></div><kbd>⌘O</kbd></button>
      <button class="w-act" type="button" data-cmd="seeddemo" id="btnSeedDemo" hidden data-od-id="action-seed-demo"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h4A1.5 1.5 0 0 1 8 5v8.5a1.5 1.5 0 0 0-1.5-1.5h-4z"/><path d="M13.5 3.5h-4A1.5 1.5 0 0 0 8 5v8.5A1.5 1.5 0 0 1 9.5 12h4z"/></svg><div><b data-i18n="훈민정음 데모 열기">훈민정음 데모 열기</b><span data-i18n="御製序 원문·표점·번역안이 들어 있는 예시 프로젝트">御製序 원문·표점·번역안이 들어 있는 예시 프로젝트</span></div></button>
    </div>
  </section>

  <section class="w-right" data-od-id="welcome-recent">
    <section class="w-project-section" aria-labelledby="localProjectsHeading">
      <header class="w-project-heading"><h2 id="localProjectsHeading" data-i18n="로컬 프로젝트">로컬 프로젝트</h2><span data-i18n="최근 열어 본 프로젝트">최근 열어 본 프로젝트</span></header>
      <div id="recentList"></div>
    </section>
    <section class="w-project-section w-online-projects" aria-labelledby="onlineProjectsHeading">
      <header class="w-project-heading"><h2 id="onlineProjectsHeading" data-i18n="온라인 프로젝트">온라인 프로젝트</h2><span id="onlineProjectCount"></span><button type="button" class="btn btn-ghost btn-sm" id="btnRefreshOnlineProjects" aria-label="온라인 프로젝트 새로고침" data-i18n-aria-label="온라인 프로젝트 새로고침" disabled><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 6A5 5 0 1 0 13 10M13 2v4H9"/></svg></button></header>
      <div id="onlineProjectList" aria-live="polite"><p class="w-project-empty" data-i18n="계정을 확인하고 있습니다.">계정을 확인하고 있습니다.</p></div>
    </section>
  </section>
</main>

<dialog class="online-project-dialog" id="dlgCreateOnlineProject" aria-labelledby="createOnlineProjectHeading">
  <form id="createOnlineProjectForm">
    <header class="dl-h" id="createOnlineProjectHeading" data-i18n="온라인 프로젝트 만들기">온라인 프로젝트 만들기</header>
    <div class="dl-b">
      <div class="field"><label for="onlineProjectTitle" data-i18n="프로젝트 이름">프로젝트 이름</label><input class="input" id="onlineProjectTitle" name="title" autocomplete="off" maxlength="160" required placeholder="예: 관서악부 연구" data-i18n-placeholder="예: 관서악부 연구" autofocus></div>
      <div class="field"><label for="onlineProjectDescription"><span data-i18n="설명">설명</span><span class="muted" data-i18n="선택">선택</span></label><textarea class="textarea" id="onlineProjectDescription" name="description" rows="4" maxlength="4000"></textarea></div>
      <p class="online-project-account" id="onlineProjectAccount"></p>
      <p class="online-project-error" id="onlineProjectCreateError" role="alert" hidden></p>
    </div>
    <footer class="dl-f"><button class="btn" type="button" id="btnCancelOnlineProject" data-i18n="취소">취소</button><button class="btn btn-primary" type="submit" id="btnSubmitOnlineProject" data-i18n="만들기">만들기</button></footer>
  </form>
</dialog>
<dialog class="online-project-dialog" id="dlgOnlineProjectInfo" aria-labelledby="onlineProjectInfoHeading">
  <header class="dl-h" id="onlineProjectInfoHeading" data-i18n="온라인 프로젝트 정보">온라인 프로젝트 정보</header>
  <div class="dl-b" id="onlineProjectInfoContent" aria-live="polite"></div>
  <footer class="dl-f"><button class="btn" type="button" id="btnCloseOnlineProjectInfo" data-i18n="닫기">닫기</button></footer>
</dialog>

<div class="notif" id="notif" role="status" aria-live="polite"><div class="ai" aria-hidden="true">文</div><div><b id="nTitle" data-i18n="문해">문해</b><span id="nMsg"></span></div></div>
<dialog id="dlgPalette" class="palette" data-od-id="command-palette">
  <input class="input" id="palIn" placeholder="명령 검색…" data-i18n-placeholder="명령 검색…" aria-label="명령 검색" data-i18n-aria-label="명령 검색">
  <div class="pl-list" id="palList"></div>
</dialog>
</body>
</html>
