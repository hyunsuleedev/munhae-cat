<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; font-src 'self'; connect-src 'self'">
<title data-i18n="용어집 — 문해 Munhae Studio">용어집 — 문해 Munhae Studio</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/chrome.css">
<link rel="stylesheet" href="./styles/knowledge.css">
<script type="module" blocking="render" src="./scripts/app-entry.ts"></script>
</head>
<body data-auth-pending class="materials-hub" data-knowledge-page="glossary">

<div class="win" id="win" data-od-id="app-window">
  <aside class="sidebar" id="sidebar" data-od-id="sidebar" aria-label="탐색" data-i18n-aria-label="탐색">
    <div class="sb-top"><div class="tl" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div></div>
    <div class="sb-scroll" id="sbTree"></div>
    <div class="sb-foot"><a class="sb-account" href="settings.html#account" aria-label="계정 설정 열기" data-i18n-aria-label="계정 설정 열기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14v-1a5 5 0 0 1 10 0v1"/></svg><span class="sb-account-label" data-i18n="문해 계정">문해 계정</span></a></div>
  </aside>

  <div class="main">
    <header class="titlebar" data-od-id="titlebar">
      <div class="tl" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="tb-l"><button class="tb is-on" id="tbSidebar" title="사이드바 (⌃⌘S)" data-i18n-title="사이드바 (⌃⌘S)" aria-label="사이드바 토글" data-i18n-aria-label="사이드바 토글"></button></div>
      <div class="tb-c">
        <span data-i18n="용어집">용어집</span>
      </div>
      <div class="tb-r"><button class="tb is-on" id="tbInsp" title="검사기 (⌥⌘I)" aria-label="검사기 토글" data-i18n-title="검사기 (⌥⌘I)" data-i18n-aria-label="검사기 토글"></button></div>
    </header>

    <div class="content materials-content">
      <div class="split glossary-split" id="split">
        <div class="glossary-main">
          <div class="glossary-tools" role="toolbar" aria-label="용어집 도구" data-i18n-aria-label="용어집 도구">
            <label class="glossary-select-all"><input type="checkbox" class="select-checkbox" id="glossarySelectAll" aria-label="표시된 용어 전체 선택" data-i18n-aria-label="표시된 용어 전체 선택" title="표시된 용어 전체 선택·해제" data-i18n-title="표시된 용어 전체 선택·해제" aria-controls="glossaryList"></label>
            <label class="glossary-search"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="glossaryQuery" type="search" autocomplete="off" placeholder="용어·독음·뜻풀이·문서 검색" data-i18n-placeholder="용어·독음·뜻풀이·문서 검색" aria-label="용어 검색" data-i18n-aria-label="용어 검색"></label>
            <div class="glossary-tool-group glossary-selection" id="glossarySelection" hidden><span id="glossarySelectionCount" role="status" aria-live="polite"></span><button class="btn btn-ghost btn-sm glossary-delete" id="glossaryDelete" type="button"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5M7 7v3.5M9 7v3.5"/></svg><span data-i18n="삭제">삭제</span></button></div>
            <div class="glossary-tool-group glossary-kinds" id="glossaryKinds" role="group" aria-label="분류" data-i18n-aria-label="분류"></div>
            <div class="glossary-tool-group glossary-sort-menu">
              <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M2.5 10.5 5 13l2.5-2.5M11 13V3M8.5 5.5 11 3l2.5 2.5"/></svg>
              <select class="glossary-sort" id="glossarySort" aria-label="정렬" data-i18n-aria-label="정렬">
                <option value="reading" data-i18n="독음순">독음순</option>
                <option value="kind" data-i18n="분류순">분류순</option>
                <option value="documents" data-i18n="문서 많은 순">문서 많은 순</option>
              </select>
            </div>
            <div class="glossary-tool-group">
              <button class="btn btn-ghost btn-sm glossary-type-trigger" type="button" popovertarget="glossaryType" aria-label="글자 크기와 줄 간격" title="글자 크기와 줄 간격" data-i18n-aria-label="글자 크기와 줄 간격" data-i18n-title="글자 크기와 줄 간격"><span aria-hidden="true">가</span><span aria-hidden="true">가</span></button>
              <div class="glossary-type-settings" id="glossaryType" popover data-reading-type-fields="glossaryType"></div>
            </div>
          </div>
          <div class="tbl-wrap glossary-list" id="glossaryList" data-od-id="glossary-table"></div>
        </div>

        <aside class="insp" id="insp" data-od-id="inspector" aria-label="검사기" data-i18n-aria-label="검사기">
          <div class="materials-detail-top" hidden><span id="detailMeta" data-i18n="자료를 선택하세요">자료를 선택하세요</span></div>
          <div id="detail" class="materials-detail"><div class="materials-empty-detail"><span aria-hidden="true">文</span><h2><span data-i18n="배경과 판단을">배경과 판단을</span><br><span data-i18n="번역 곁에.">번역 곁에.</span></h2><p><span data-i18n="용어를 고르면 뜻풀이와 문서별 쓰임을 볼 수 있습니다.">용어를 고르면 뜻풀이와 문서별 쓰임을 볼 수 있습니다.</span></p></div></div>
        </aside>
      </div>
    </div>
  </div>

  <footer class="statusbar" data-od-id="statusbar">
    <span class="mono" id="sbPath"></span>
    <span><span data-i18n="자료 ">자료 </span><b id="sbC">0</b><span data-i18n=" · 용어 "> · 용어 </span><b id="sbG">0</b></span>
    <span class="sp"></span>
    <span id="sbSel"></span>
    <span id="sbAgent"><i class="dot"></i>AI</span>
    <button id="sbPalette" type="button" title="명령 검색" data-i18n-title="명령 검색">⌘K</button>
  </footer>
</div>

<div class="notif" id="notif" role="status" aria-live="polite"><div class="ai" aria-hidden="true">文</div><div><b id="nTitle" data-i18n="문해">문해</b><span id="nMsg"></span></div></div>

<dialog id="dlgPalette" class="palette" data-od-id="command-palette">
  <input class="input" id="palIn" placeholder="명령 검색…" data-i18n-placeholder="명령 검색…" aria-label="명령 검색" data-i18n-aria-label="명령 검색">
  <div class="pl-list" id="palList"></div>
</dialog>

</body>
</html>
