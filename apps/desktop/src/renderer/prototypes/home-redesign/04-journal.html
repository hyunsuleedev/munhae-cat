<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 작업 일지 — 홈 시안</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/chrome.css">
<link rel="stylesheet" href="./shared.css">
<style>
/* 04 작업 일지: the home is a dated log of the work, with a narrow rail for where to pick up. */
.jr-root { display: block; container: journal / inline-size; background: var(--surface); }
.jr {
  --time: 50px;
  --gut: calc(var(--time) + 14px);
  max-width: 1040px;
  margin: 0 auto;
  padding: 30px 40px 64px;
  color: var(--fg);
  font-size: 13px;
  line-height: 1.6;
}
.jr-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.jr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.jr-head h1 { margin: 0; font: 500 21px/1.35 var(--font-hanmun); letter-spacing: -.02em; overflow-wrap: anywhere; }
.jr-head p { margin: 0; color: var(--muted); font-size: 11.5px; }

.jr-layout { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 52px; align-items: start; padding-top: 18px; }
.jr-log { min-width: 0; max-width: 720px; }

.jr-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px var(--gut); }
.jr-filters button {
  min-height: 26px;
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 11.5px;
  line-height: 1.5;
}
.jr-filters button[aria-pressed="true"] { border-color: color-mix(in oklch, var(--fg) 28%, var(--border)); background: var(--fg-soft); color: var(--fg); font-weight: 500; }

.jr-day-h {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  gap: 7px;
  margin: 0;
  padding: 16px 0 7px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .01em;
}
.jr-day-h b { color: var(--fg); font-weight: 600; }
.jr-day-h:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.jr-entries, .jr-events { margin: 0; padding: 0; list-style: none; }
.jr-entries { padding: 4px 0 14px; }
.jr-entry { padding: 12px 0 4px; }

.jr-doc {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
  max-width: calc(100% - var(--gut));
  margin: 0 0 3px var(--gut);
  padding: 1px 0;
  border: 0;
  border-radius: 2px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  text-align: left;
}
.jr-doc-title { font: 500 15px/1.5 var(--font-hanmun); letter-spacing: -.01em; }
.jr-doc-opening { color: var(--muted); font: 14px/1.5 var(--font-hanmun); overflow-wrap: anywhere; }

.jr-event { display: grid; grid-template-columns: var(--time) 14px minmax(0, 1fr); align-items: baseline; padding: 2px 0; }
.jr-event time { color: var(--muted); font: 10.5px/1.7 var(--font-mono); font-variant-numeric: tabular-nums; }
.jr-mark { display: inline-block; width: 6px; height: 6px; border-radius: 1px; transform: translateY(-1px); }
.jr-mark.ring { border: 1px solid color-mix(in oklch, var(--muted) 70%, transparent); border-radius: 50%; }
.jr-mark.ring-accent { border-color: var(--accent); }
.jr-text { min-width: 0; font-size: 12.5px; line-height: 1.7; overflow-wrap: anywhere; }
.jr-diff { grid-column: 3; margin: 3px 0 4px; font: 14px/1.85 var(--font-hanmun); word-break: keep-all; overflow-wrap: anywhere; }
.jr-diff del { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--muted) 80%, transparent); }
.jr-diff ins { color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 4px; }
.jr-diff .jr-arrow { padding: 0 6px; color: var(--muted); font-family: var(--font-ui); font-size: 11px; }

.jr-batch { min-width: 0; font-size: 12.5px; line-height: 1.7; }
.jr-batch summary { width: fit-content; max-width: 100%; list-style: none; border-radius: 2px; }
.jr-batch summary::-webkit-details-marker { display: none; }
.jr-batch summary::after { content: "⌄"; display: inline-block; margin-left: 6px; color: var(--muted); font-size: 11px; transition: transform .15s; }
.jr-batch[open] summary::after { transform: rotate(180deg); }
.jr-range { margin-left: 6px; color: var(--muted); font-family: var(--font-hanmun); font-size: 13px; }
.jr-batch-docs { display: flex; flex-wrap: wrap; gap: 0 2px; margin: 6px 0 4px -6px; }
.jr-batch-docs button { padding: 2px 6px; border: 0; border-radius: 2px; background: transparent; color: var(--fg); font: 13px/1.6 var(--font-hanmun); }

.jr-more { margin: 4px 0 0 var(--gut); padding: 5px 11px; border: 1px solid var(--border); border-radius: 4px; background: transparent; color: var(--muted); font: inherit; font-size: 11.5px; }
.jr-none { margin: 22px 0 0 var(--gut); color: var(--muted); font-size: 12px; }

.jr-rail { position: sticky; top: 18px; display: grid; gap: 26px; min-width: 0; padding: 6px 0 0 24px; border-left: 1px solid var(--border); }
.jr-label { margin: 0 0 8px; color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .03em; }
.jr-label b { margin-left: 4px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.jr-resume {
  display: block;
  width: 100%;
  padding: 11px 13px 12px;
  border: 0;
  background: var(--row-tint);
  box-shadow: inset 2px 0 0 var(--accent-ink);
  color: var(--fg);
  font: inherit;
  text-align: left;
}
.jr-resume-title { display: block; font: 500 17px/1.45 var(--font-hanmun); letter-spacing: -.015em; }
.jr-resume-opening { display: block; color: var(--muted); font: 14px/1.6 var(--font-hanmun); overflow-wrap: anywhere; }
.jr-resume-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 9px; color: var(--muted); font-size: 11px; }
.jr-resume-go { margin-left: auto; color: var(--accent); }
.jr-questions { margin: 0; padding: 0; border-bottom: 1px solid var(--border); list-style: none; }
.jr-q { display: grid; gap: 1px; width: 100%; padding: 7px 0 8px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--fg); font: inherit; text-align: left; }
.jr-q-title { font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
.jr-q-doc { color: var(--muted); font: 11.5px/1.5 var(--font-hanmun); }
.jr-progress-line { display: flex; align-items: baseline; gap: 5px; margin: 0; color: var(--muted); font-size: 11.5px; }
.jr-progress-line b { color: var(--fg); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.jr-bar { display: flex; gap: 1px; height: 4px; margin-top: 8px; overflow: hidden; border-radius: 2px; background: var(--fg-soft); }
.jr-bar > span { display: block; min-width: 2px; }
.jr-legend { display: flex; flex-wrap: wrap; gap: 2px 11px; margin: 8px 0 0; padding: 0; color: var(--muted); font-size: 10.5px; list-style: none; }
.jr-legend i { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 1px; }
.jr-legend b { margin-left: 3px; color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

.jr-empty { padding: 56px 0 0; }
.jr-empty p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }

@media (hover: hover) and (pointer: fine) {
  .jr-filters button:hover:not([aria-pressed="true"]) { background: var(--fg-soft); color: var(--fg); }
  .jr-doc:hover .jr-doc-title, .jr-q:hover .jr-q-title, .jr-batch-docs button:hover, .jr-resume:hover .jr-resume-title { color: var(--accent); }
  .jr-batch summary:hover { color: var(--accent); }
  .jr-more:hover { background: var(--fg-soft); color: var(--fg); }
}

@container journal (max-width: 820px) {
  .jr { padding: 24px 28px 48px; }
  .jr-layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 16px; }
  .jr-log { max-width: none; }
  .jr-rail { order: -1; position: static; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 28px; margin-bottom: 14px; padding: 0 0 18px; border-left: 0; border-bottom: 1px solid var(--border); }
  .jr-rail > .jr-rail-resume { grid-column: 1 / -1; }
  .jr-rail:not(:has(.jr-rail-questions)) > .jr-rail-progress { grid-column: 1 / -1; }
  .jr-resume { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; padding: 10px 13px; }
  .jr-resume-title { font-size: 16px; }
  .jr-resume-opening { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jr-resume-meta { margin-top: 0; flex-wrap: nowrap; white-space: nowrap; }
  .jr-q { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0; }
  .jr-q-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@container journal (max-width: 600px) {
  .jr { --time: 42px; --gut: calc(var(--time) + 12px); padding: 20px 18px 40px; }
  .jr-event { grid-template-columns: var(--time) 12px minmax(0, 1fr); }
  .jr-rail { grid-template-columns: minmax(0, 1fr); }
  .jr-resume { grid-template-columns: minmax(0, 1fr) auto; }
  .jr-resume-opening { grid-column: 1 / -1; grid-row: 2; }
  .jr-filters { margin-left: 0; }
}
</style>
</head>
<body>
<script type="module">
import { mountShell, getDemo, esc, stageLabel, fmtWhen, fmtDay, fmtTime, toast } from './shared.js';

const demo = getDemo();
const root = mountShell({ design: '04 작업 일지', status: '작업 일지' });
root.classList.add('jr-root');

const docsById = new Map(demo.docs.map(doc => [doc.id, doc]));
const docOrder = new Map(demo.docs.map((doc, index) => [doc.id, index]));
const FILTERS = [
  { key: 'all', label: '전체', kinds: null },
  { key: 'translation', label: '번역', kinds: ['translation', 'ai'] },
  { key: 'punctuation', label: '표점', kinds: ['punctuation'] },
  { key: 'uncertainty', label: '의문', kinds: ['uncertainty'] },
  { key: 'confirm', label: '확정', kinds: ['confirm', 'review'] },
];
const MARK = {
  translation: 'st-fill st-translation', punctuation: 'st-fill st-punctuation', confirm: 'st-fill st-confirmed',
  review: 'st-fill st-review', add: 'st-fill st-source', ai: 'ring', comment: 'ring', uncertainty: 'ring ring-accent',
};
const DAYS_PER_PAGE = 3;
let filter = 'all';
let visibleDays = DAYS_PER_PAGE;

const dayKey = date => `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
const isoLocal = date => new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

/** "爲政 13–24", "八佾 7–26 · 里仁 2–26" from a set of documents. */
function rangeLabel(docs) {
  const books = new Map();
  for (const doc of [...docs].sort((a, b) => docOrder.get(a.id) - docOrder.get(b.id))) {
    const key = doc.book ?? doc.title;
    if (!books.has(key)) books.set(key, []);
    if (doc.book) books.get(key).push(doc.no);
  }
  return [...books].map(([book, numbers]) => {
    if (!numbers.length) return book;
    const runs = [];
    for (const n of numbers) {
      const run = runs.at(-1);
      if (run && n === run[1] + 1) run[1] = n; else runs.push([n, n]);
    }
    return `${book} ${runs.map(([a, b]) => a === b ? a : `${a}–${b}`).join(', ')}`;
  }).join(' · ');
}

/**
 * The fixtures keep only each document's latest event, so a document that got a later event
 * (e.g. an uncertainty) drops out of its import. A still-unpunctuated document inside the
 * imported range of its book was part of the same import.
 */
function importedTogether(docs) {
  const found = new Set(docs.map(doc => doc.id));
  for (const book of new Set(docs.map(doc => doc.book).filter(Boolean))) {
    const numbers = docs.filter(doc => doc.book === book).map(doc => doc.no);
    const [low, high] = [Math.min(...numbers), Math.max(...numbers)];
    for (const doc of demo.docs) if (doc.book === book && doc.no > low && doc.no < high && doc.stage === 'source') found.add(doc.id);
  }
  return [...found].map(id => docsById.get(id)).sort((a, b) => docOrder.get(a.id) - docOrder.get(b.id));
}

/** Day → entries. Consecutive events on one doc share an entry; same-moment source imports collapse into one. */
function buildDays(events) {
  const days = [];
  for (const event of events) {
    const key = dayKey(event.at);
    let day = days.at(-1);
    if (!day || day.key !== key) { day = { key, date: event.at, entries: [] }; days.push(day); }
    const last = day.entries.at(-1);
    if (event.kind === 'add') {
      if (last?.batch && +last.at === +event.at) last.events.push(event);
      else day.entries.push({ batch: true, at: event.at, events: [event] });
    } else if (last && !last.batch && last.docId === event.docId) {
      last.events.push(event);
    } else {
      day.entries.push({ docId: event.docId, events: [event] });
    }
  }
  for (const day of days) {
    day.entries = day.entries.map(entry => {
      if (!entry.batch) return entry;
      entry.docs = importedTogether(entry.events.map(event => docsById.get(event.docId)));
      return entry.docs.length === 1 ? { docId: entry.events[0].docId, events: entry.events } : entry;
    });
  }
  return days;
}

function eventLine(event, body = `<span class="jr-text">${esc(event.text)}</span>`) {
  const diff = event.diff
    ? `<p class="jr-diff"><span class="jr-sr">고친 표현: </span><del>${esc(event.diff[0])}</del><span class="jr-arrow" aria-hidden="true">→</span><span class="jr-sr">에서 </span><ins>${esc(event.diff[1])}</ins></p>`
    : '';
  return `<li class="jr-event"><time datetime="${isoLocal(event.at)}">${fmtTime(event.at)}</time><span class="jr-mark ${MARK[event.kind] ?? 'ring'}" aria-hidden="true"></span>${body}${diff}</li>`;
}

function entryHtml(entry) {
  if (entry.batch) {
    const docs = entry.docs;
    const list = docs
      .map(doc => `<button type="button" data-open-doc="${esc(doc.id)}" title="${esc(doc.opening)}">${esc(doc.title)}</button>`).join('');
    const body = `<details class="jr-batch"><summary>원문 ${docs.length}개 추가<span class="jr-range">${esc(rangeLabel(docs))}</span></summary><div class="jr-batch-docs">${list}</div></details>`;
    return `<li class="jr-entry"><ol class="jr-events">${eventLine(entry.events[0], body)}</ol></li>`;
  }
  const doc = docsById.get(entry.docId);
  return `<li class="jr-entry"><button class="jr-doc" type="button" data-open-doc="${esc(doc.id)}"><span class="jr-doc-title">${esc(doc.title)}</span>${doc.opening !== doc.title ? `<span class="jr-doc-opening">${esc(doc.opening)}</span>` : ''}</button><ol class="jr-events">${entry.events.map(event => eventLine(event)).join('')}</ol></li>`;
}

function dayHtml(day) {
  const [lead, rest] = fmtDay(day.date).split(' · ');
  const label = rest ? `<b>${esc(lead)}</b><span>${esc(rest)}</span>` : `<b>${esc(lead)}</b>`;
  return `<section class="jr-day" aria-labelledby="day-${day.key}"><h2 class="jr-day-h" id="day-${day.key}" tabindex="-1">${label}</h2><ol class="jr-entries">${day.entries.map(entryHtml).join('')}</ol></section>`;
}

function renderLog(focusDay = null) {
  const kinds = FILTERS.find(item => item.key === filter).kinds;
  const days = buildDays(demo.events.filter(event => !kinds || kinds.includes(event.kind)));
  const log = root.querySelector('#jrLog');
  log.innerHTML = days.length
    ? days.slice(0, visibleDays).map(dayHtml).join('') + (days.length > visibleDays ? '<button class="jr-more" type="button" data-more>이전 기록 더 보기</button>' : '')
    : '<p class="jr-none">이 종류의 기록이 없습니다.</p>';
  if (focusDay) log.querySelector(`#day-${CSS.escape(focusDay)}`)?.focus();
  return days;
}

function railHtml() {
  const resume = demo.resume;
  const open = demo.uncertainties.filter(item => item.state === 'open').sort((a, b) => b.at - a.at);
  const order = ['confirmed', 'review', 'translation', 'punctuation', 'source'];
  const stages = order.map(key => ({ key, label: stageLabel(key), count: demo.stats[key] }));
  const summary = stages.map(stage => `${stage.label} ${stage.count}`).join(', ');
  const resumeMeta = `${stageLabel(resume.stage)}${resume.version ? ` v${resume.version}` : ''}`;
  return `<aside class="jr-rail" aria-label="이어서 작업">
    <section class="jr-rail-resume"><h2 class="jr-label">이어서</h2>
      <button class="jr-resume" type="button" data-open-doc="${esc(resume.id)}"><span class="jr-resume-title">${esc(resume.title)}</span>${resume.opening !== resume.title ? `<span class="jr-resume-opening">${esc(resume.opening)}</span>` : ''}<span class="jr-resume-meta"><span>${esc(resumeMeta)}</span><span>${esc(fmtWhen(resume.updatedAt))}</span><span class="jr-resume-go" aria-hidden="true">열기 →</span></span></button>
    </section>
    ${open.length ? `<section class="jr-rail-questions"><h2 class="jr-label">열린 의문<b>${open.length}</b></h2><ul class="jr-questions">${open.map(item => {
      const doc = docsById.get(item.docId);
      return `<li><button class="jr-q" type="button" data-open-doc="${esc(doc.id)}" title="${esc(item.note)}"><span class="jr-q-title">${esc(item.title)}</span><span class="jr-q-doc">${esc(doc.title)}</span></button></li>`;
    }).join('')}</ul></section>` : ''}
    <section class="jr-rail-progress"><h2 class="jr-label">진행</h2>
      <p class="jr-progress-line"><span>확정</span><b>${demo.stats.confirmed}</b><span>/ ${demo.stats.total}</span></p>
      <div class="jr-bar" role="img" aria-label="${esc(summary)}">${stages.filter(stage => stage.count).map(stage => `<span class="st-fill st-${stage.key}" style="flex:${stage.count}"></span>`).join('')}</div>
      <ul class="jr-legend" aria-hidden="true">${stages.slice(1).filter(stage => stage.count).map(stage => `<li><i class="st-fill st-${stage.key}"></i>${esc(stage.label)}<b>${stage.count}</b></li>`).join('')}</ul>
    </section>
  </aside>`;
}

const meta = [demo.project.subtitle, demo.project.base].filter(Boolean).join(' · ');
const head = `<header class="jr-head"><h1>${esc(demo.project.title)}</h1>${meta ? `<p>${esc(meta)}</p>` : ''}</header>`;

if (!demo.docs.length) {
  root.innerHTML = `<div class="jr">${head}<div class="jr-empty"><p>아직 기록이 없습니다.</p><button class="btn btn-primary" type="button" data-add-source>원문 추가</button></div></div>`;
} else {
  root.innerHTML = `<div class="jr">${head}<div class="jr-layout">
    <section class="jr-log" aria-label="작업 기록">
      <div class="jr-filters" role="group" aria-label="기록 종류">${FILTERS.map(item => `<button type="button" data-filter="${item.key}" aria-pressed="${item.key === filter}">${item.label}</button>`).join('')}</div>
      <div id="jrLog"></div>
    </section>
    ${railHtml()}
  </div></div>`;
  renderLog();
}

root.addEventListener('click', event => {
  const target = event.target.closest('[data-filter], [data-more], [data-add-source]');
  if (!target) return;
  if (target.dataset.filter) {
    filter = target.dataset.filter;
    visibleDays = DAYS_PER_PAGE;
    for (const chip of root.querySelectorAll('[data-filter]')) chip.setAttribute('aria-pressed', String(chip === target));
    renderLog();
  } else if (target.hasAttribute('data-more')) {
    const before = visibleDays;
    visibleDays += DAYS_PER_PAGE;
    const kinds = FILTERS.find(item => item.key === filter).kinds;
    const next = buildDays(demo.events.filter(item => !kinds || kinds.includes(item.kind)))[before];
    renderLog(next?.key);
  } else if (target.hasAttribute('data-add-source')) {
    toast('원문 추가 창은 시안에서 열리지 않습니다.');
  }
});
</script>
</body>
</html>
