<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; font-src 'self'; connect-src 'self'">
<title>프로젝트 홈 — 문해 Munhae Studio</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/chrome.css">
<link rel="stylesheet" href="./styles/home.css">
<script type="module" blocking="render" src="./scripts/home.ts"></script>
</head>
<body>
<nav class="menubar" id="menubar" aria-label="메뉴 막대"></nav>

<div class="win" id="win" data-od-id="app-window">
  <aside class="sidebar" id="sidebar" data-od-id="sidebar" aria-label="탐색">
    <div class="sb-top"><div class="tl" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div></div>
    <div class="sb-scroll" id="sbTree"></div>
    <div class="sb-foot"><i class="dot"></i>AI<span class="sp"></span><span class="mono">0.1.0</span></div>
  </aside>

  <div class="main">
    <header class="titlebar" data-od-id="titlebar">
      <div class="tl" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="tb-l"><button class="tb is-on" id="tbSidebar" title="사이드바 (⌃⌘S)" aria-label="사이드바 토글"></button></div>
      <div class="tb-c"><span class="proxy" aria-hidden="true"></span><span id="tbTitle">프로젝트</span><small id="tbSub">— 로컬 프로젝트</small></div>
      <div class="tb-r">
        <button class="tb" id="btnBackup" type="button" data-od-id="btn-backup">백업</button>
        <button class="tb" id="btnExport" type="button" data-od-id="btn-export">내보내기</button>
        <button class="btn btn-primary" id="btnContinue" type="button" data-od-id="btn-continue">편집 계속</button>
        <button class="tb is-on" id="tbInsp" title="검사기 (⌥⌘I)" aria-label="검사기 토글"></button>
      </div>
    </header>

    <div class="content">
      <div class="scope" data-od-id="doc-toolbar">
        <input class="input" id="q" type="search" placeholder="원문 단위 검색" aria-label="원문 단위 검색" style="width:220px">
        <select class="select" id="statusSel" aria-label="상태 필터" style="width:auto">
          <option value="">모든 상태</option>
          <option value="draft">작업 중 (원문·표점·번역안)</option>
          <option value="review">재검토 필요</option>
          <option value="confirmed">번역 확정</option>
        </select>
        <span class="sp"></span>
        <span class="muted" id="scopeMeta"><b class="mono" id="rowCount" style="color:var(--fg)">0</b>개 원문 단위</span>
        <button class="btn" id="btnNewDoc" type="button" data-od-id="btn-new-doc">원문 단위 추가 <kbd>⌘N</kbd></button>
      </div>

      <div class="split" id="split">
        <div class="tbl-wrap" data-od-id="document-list">
          <table class="tbl">
            <thead><tr><th style="width:38%">원문 단위</th><th>원문</th><th>표점</th><th>번역</th><th style="width:88px">불확실성</th></tr></thead>
            <tbody id="docBody"></tbody>
          </table>
        </div>

        <aside class="insp" id="insp" data-od-id="inspector" aria-label="검사기">
          <details class="grp" open data-od-id="selected-doc">
            <summary>선택한 항목<span class="tail mono" id="selMeta"></span></summary>
            <div class="grp-b" id="selBody"></div>
          </details>
          <details class="grp" open data-od-id="progress-group">
            <summary>단계별 진행률<span class="tail" id="progTail">원문 단위</span></summary>
            <div class="grp-b prog" id="progBody"></div>
          </details>
          <details class="grp" open data-od-id="uncertainty-group">
            <summary>열린 불확실성<span class="tail"><a id="uncAll" href="knowledge.html#uncertainty">모두 보기 ›</a></span></summary>
            <div class="grp-b list" id="uncList"></div>
          </details>
          <details class="grp" open data-od-id="recent-group">
            <summary>최근 작업</summary>
            <div class="grp-b list" id="recentList"></div>
          </details>
          <details class="grp" data-od-id="ai-group">
            <summary>AI 연결<span class="tail">토큰은 CLI가 보관</span></summary>
            <div class="grp-b">
              <dl class="kv" id="agentList"></dl>
            </div>
          </details>
          <details class="grp" data-od-id="share-group">
            <summary>확정·공유</summary>
            <div class="grp-b" style="font-size:12px" id="shareBody">확정 건수와 공유 상태를 불러오는 중…</div>
          </details>
        </aside>
      </div>
    </div>
  </div>

  <footer class="statusbar" data-od-id="statusbar">
    <span class="mono" id="sbPath"></span>
    <span>SQLite · WAL · 로컬 전용</span>
    <span class="sp"></span>
    <span>번역 정책 · 단일 완성 번역</span>
    <span>저장됨 <b id="sbSaved">—</b></span>
    <span id="sbAgent"><i class="dot"></i>AI</span>
    <button id="sbPalette" type="button" title="명령 검색">⌘K</button>
  </footer>
</div>

<div class="notif" id="notif" role="status" aria-live="polite"><div class="ai" aria-hidden="true">文</div><div><b id="nTitle">문해</b><span id="nMsg"></span></div></div>



<dialog id="dlgPalette" class="palette" data-od-id="command-palette">
  <input class="input" id="palIn" placeholder="명령 검색…" aria-label="명령 검색">
  <div class="pl-list" id="palList"></div>
</dialog>

</body>
</html>
