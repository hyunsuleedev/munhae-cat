<div class="shell">
<aside class="sidebar" aria-label="시연 구절"><div class="brand"><strong>文解</strong><span>MUNHAE STUDIO</span></div><p class="side-label">연구할 구절</p><nav class="passage-nav" id="passageNav"></nav><div class="sidebar-bottom"><span class="demo-tag">구절 연구 · 배치 비교</span><p>훈음과 뜻풀이는 시연용입니다.<br>실제 문서에는 반영되지 않습니다.</p><button class="text-button" id="resetDemo">시연 처음으로</button></div></aside>

<script id="passage-data">
/*
 * UI comparison fixtures, not dictionary exports or reviewed research records.
 * All Korean senses, explanations, translations and alignments below were
 * written for this demonstration. Source glyphs are not normalized.
 * Token indices are zero-based across clauses.flat(); group.to is exclusive.
 * Public-domain source text checked against:
 * https://zh.wikisource.org/wiki/論語/學而第一
 * https://zh.wikisource.org/wiki/禮記/大學
 */
(() => {
  'use strict';
  const sense = (text, explanation) => ({ text, explanation });
  const token = (char, reading, basic, senses, chosen = 0) => ({
    char, reading, basic, senses, chosen
  });
  const single = (char, reading, basic, text, explanation, chosen = 0) =>
    token(char, reading, basic, [sense(text, explanation)], chosen);
  const group = (id, from, to, label, reading, meaning, explanation) => ({
    id, from, to, label, reading, sense: meaning, explanation
  });

  const gwanseo = {
    id: 'gwanseo',
    title: '관서악부서',
    sourceLabel: '시연용 풀이 · 현재 문서의 구절',
    sourceText: '然金陵 ， 錢塘 皆有唐 ， 宋才子歌詩 輝暎湖山 以餙大平',
    translation: '그러나 금릉과 전당에는 모두 당·송나라 재자들의 시가 있어, 호수와 산을 빛내고 태평한 시대를 꾸민다.',
    clauses: [
      [
        token('然', '연', '그러할', [
          sense('그러나', '앞선 내용에서 화제를 전환하거나 대조하는 접속 표현으로 읽는 시연안입니다.'),
          sense('그러하다', '앞서 말한 내용을 받아 긍정하는 서술로 읽는 뜻 후보입니다.')
        ]),
        token('金', '금', '쇠', [
          sense('쇠붙이', '낱자의 기본 의미입니다. 이 자리의 金陵은 두 글자를 함께 지명으로 살핍니다.'),
          sense('금', '금속인 금을 가리키는 뜻 후보입니다. 이 자리에서는 지명 풀이와 구별해야 합니다.')
        ], null),
        single('陵', '릉', '언덕', '큰 언덕', '낱자의 기본 의미입니다. 이 자리에서는 金陵의 일부로 읽으므로 어휘 풀이를 함께 봅니다.', null),
        token('錢', '전', '돈', [
          sense('돈', '낱자의 기본 의미입니다. 이 자리의 錢塘은 두 글자를 함께 지명으로 살핍니다.'),
          sense('동전', '금속 화폐를 가리키는 뜻 후보입니다. 지명 錢塘의 번역으로 채택하지는 않습니다.')
        ], null),
        single('塘', '당', '못', '못·제방', '낱자의 기본 의미입니다. 이 자리에서는 錢塘의 일부로 읽습니다.', null),
        single('皆', '개', '다', '모두', '앞에 나온 두 장소에 공통으로 해당함을 나타내는 시연 풀이입니다.'),
        token('有', '유', '있을', [
          sense('있다', '뒤의 시가가 존재함을 서술하는 뜻으로 읽습니다.'),
          sense('가지다', '무언가를 소유하거나 갖추었다는 뜻 후보입니다.')
        ]),
        single('唐', '당', '당나라', '당나라', '宋과 나란히 시대 이름으로 읽습니다. 원문의 사이 표점은 그대로 보존했습니다.'),
        single('宋', '송', '송나라', '송나라', '唐과 나란히 시대 이름으로 읽는 시연 풀이입니다.'),
        single('才', '재', '재주', '재주', '子와 함께 才子라는 어휘를 이룹니다. 두 글자를 묶은 풀이를 함께 봅니다.'),

function status(){const d=selectedData();$('saveState').textContent=dirty()?'저장하지 않은 변경':records[recordKey()]?'이 데모에 저장됨':'시연 예시';$('saveSelection').disabled=d.multi||(!dirty()&&!!records[recordKey()]);$('discardDraft').disabled=!dirty();$('clearMeaning').disabled=d.multi||draft().sense===null;}
function renderInspector(){const data=selectedData(),dr=draft();$('selectedWord').textContent=data.word;$('selectedWord').classList.toggle('small-glyph',selected.length>3);$('selectedBasic').textContent=data.basic;$('selectionType').textContent=data.group?'선택한 어휘':data.multi?'선택한 범위':'선택한 글자';$('selectionPosition').textContent=selected.length===1?`${selected[0]+1}번째 글자`:`${selected[0]+1}–${selected.at(-1)+1}번째`;$('readingInput').value=dr.reading;$('readingInput').disabled=!!data.multi;$('selectedMeaning').textContent=dr.sense===null?'아직 선택하지 않았습니다.':data.senses[dr.sense].text;
$('senseList').innerHTML=data.senses.map((s,i)=>`<button type="button" class="sense-option" data-sense="${i}" aria-pressed="${dr.sense===i}"><strong>${esc(s.text)}</strong><p>${esc(s.explanation)}</p><small>${dr.sense===i?'선택한 뜻':'이 뜻 선택'}</small></button>`).join('')||(data.multi?'<p class="empty-message">이 범위의 어휘 풀이는 준비되지 않았습니다. 밑줄로 묶인 어휘를 누르거나 한 글자씩 살펴보세요.</p>':'<p class="empty-message">준비된 뜻 후보가 없습니다.</p>');
$('selectionNote').textContent=data.group?'묶음의 뜻과 각 한자의 기본 훈을 함께 확인합니다.':data.multi?'한자별 풀이와 별도로 어휘의 뜻을 기록하는 동작을 보여 주는 데모입니다.':'기본 훈은 글자의 일반적인 뜻입니다. 선택한 뜻은 이 위치에 따로 기록됩니다.';status();}
function punctuationAfter(index){const chars=tokens();let pos=0;for(let i=0;i<=index;i++){const found=passage().sourceText.indexOf(chars[i].char,pos);if(found<0)return '';pos=found+chars[i].char.length;}const next=index+1<chars.length?passage().sourceText.indexOf(chars[index+1].char,pos):passage().sourceText.length;return passage().sourceText.slice(pos,next).replace(/\s/g,'');}
function groupRecord(g){const r=records[passage().id+':'+range(g.from,g.to).join('-')];return r&&(r.sense===0||r.sense===null)?r:{reading:g.reading,sense:0};}
function orderFor(index){const n=(passage().segments||[]).findIndex(s=>s.indices.includes(index));return n<0?'':n+1;}
function getRows(){const rows=[];let pending=[],start=0;for(const clause of passage().clauses){const end=start+clause.length;if(pending.length+clause.length<=columns){pending.push(...range(start,end));start=end;continue;}if(pending.length){rows.push(pending);pending=[];}let at=start;while(end-at>columns){let stop=at+columns;const crossing=groups().find(g=>g.from<stop&&g.to>stop&&g.from>at&&g.to-g.from<=columns);if(crossing)stop=crossing.from;rows.push(range(at,stop));at=stop;}pending=range(at,end);start=end;}if(pending.length)rows.push(pending);return rows;}
function renderGrid(){const node=$('readingGrid');node.classList.toggle('mode-cards',layout==='cards');node.classList.toggle('hide-basic',!$('basicToggle').checked);node.style.setProperty('--cols',columns);
node.innerHTML=getRows().map(indices=>{const offset=layout==='cards'?1:2;return `<div class="study-line">${layout==='aligned'?'<span class="row-label r1">원문</span><span class="row-label r2">독음</span><span class="row-label r3">기본 훈</span><span class="row-label r4">선택 뜻</span>':''}${indices.map((i,k)=>{const t=tokens()[i],r=tokenRecord(i),text=r.sense===null?'—':t.senses[r.sense].text;return `<button type="button" class="token" data-index="${i}" style="grid-column:${k+offset}" aria-pressed="${selected.includes(i)}" aria-label="${esc(t.char)} · ${i+1}번째 · 기본 훈 ${esc(t.basic)} · ${r.sense===null?'선택한 뜻 없음':esc(text)}" tabindex="${i===selected[0]?0:-1}">${$('orderToggle').checked?`<span class="order">${orderFor(i)}</span>`:''}<span class="glyph">${esc(t.char)}</span>${punctuationAfter(i)?`<span class="punctuation" aria-hidden="true">${esc(punctuationAfter(i))}</span>`:''}<span class="reading">${esc(r.reading)}</span><span class="basic">${esc(t.basic)}</span><span class="meaning${r.sense===null?' empty':''}">${esc(text)}</span></button>`;}).join('')}${groups().filter(g=>g.from>=indices[0]&&g.to<=indices.at(-1)+1).map(g=>`<button type="button" class="group-marker" data-group="${esc(g.id)}" style="grid-column:${indices.indexOf(g.from)+offset} / span ${g.to-g.from}" aria-pressed="${same(selected,range(g.from,g.to))}" title="${groupRecord(g).sense===null?'선택한 뜻 없음':esc(g.sense)}">${esc(g.label)} · ${groupRecord(g).sense===null?'—':esc(g.sense)}</button>`).join('')}</div>`;}).join('');highlight();}
function renderDirect(){$('directSection').hidden=!$('directToggle').checked;const segments=passage().segments||[];$('directRead').innerHTML=segments.length?segments.map((s,i)=>`<button class="direct-fragment" data-segment="${i}" aria-pressed="${s.indices.some(n=>selected.includes(n))}"><strong>${esc(s.text)}</strong><small>${esc(s.indices.map(n=>tokens()[n].char).join(''))}</small></button>`).join(''):'<p class="empty-message">이 예문은 직해 대응 시연을 준비하지 않았습니다.</p>';}
function highlight(){document.querySelectorAll('.token').forEach(el=>{const i=Number(el.dataset.index);el.setAttribute('aria-pressed',String(selected.includes(i)));el.classList.toggle('linked',hoverIndices.includes(i));el.tabIndex=i===selected[0]?0:-1;});document.querySelectorAll('.group-marker').forEach(el=>{const g=groups().find(x=>x.id===el.dataset.group);el.setAttribute('aria-pressed',String(same(selected,range(g.from,g.to))));});document.querySelectorAll('.direct-fragment').forEach(el=>{const s=passage().segments[Number(el.dataset.segment)];el.setAttribute('aria-pressed',String(!!s&&s.indices.some(n=>selected.includes(n))));});}
function choose(indices,focus=false){selected=indices;hoverIndices=[];renderInspector();highlight();if(focus)$('readingGrid').querySelector(`[data-index="${selected[0]}"]`)?.focus();}
function recalc(){const width=$('readingGrid').clientWidth;const next=Math.max(3,Math.min(11,Math.floor((width-(layout==='aligned'?46:0))/72)));if(next!==columns){columns=next;renderGrid();}}
function loadPassage(index){current=index;selected=[0];anchor=0;hoverIndices=[];$('documentName').textContent=passage().title;$('passageCount').textContent=`${tokens().length}자 · ${passage().clauses.length}개 구간`;$('sourceText').textContent=passage().sourceText;$('translation').textContent=passage().translation;$('sourceLabel').textContent=passage().sourceLabel;$('passageSelect').value=String(index);document.querySelectorAll('[data-passage]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.passage)===index)));renderDirect();recalc();renderGrid();renderInspector();}
$('passageNav').innerHTML=passages.map((p,i)=>`<button data-passage="${i}" aria-pressed="${i===0}"><b>${esc(p.title)}</b><span>${p.clauses.flat().length}자 · ${i===0?'현재 연구 구절':i===1?'짧은 구절':'긴 구절'}</span></button>`).join('');$('passageSelect').innerHTML=passages.map((p,i)=>`<option value="${i}">${esc(p.title)} · ${p.clauses.flat().length}자</option>`).join('');
$('passageNav').addEventListener('click',e=>{const b=e.target.closest('[data-passage]');if(b)loadPassage(Number(b.dataset.passage));});$('passageSelect').addEventListener('change',e=>loadPassage(Number(e.target.value)));
document.querySelectorAll('[data-layout]').forEach(b=>b.addEventListener('click',()=>{layout=b.dataset.layout;document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));recalc();renderGrid();}));
$('readingGrid').addEventListener('click',e=>{const b=e.target.closest('[data-index]'),g=e.target.closest('[data-group]');if(b){const index=Number(b.dataset.index);if(e.shiftKey)choose(range(Math.min(anchor,index),Math.max(anchor,index)+1));else{anchor=index;choose([index]);}}else if(g){const group=groups().find(x=>x.id===g.dataset.group);anchor=group.from;choose(range(group.from,group.to));}});
$('readingGrid').addEventListener('keydown',e=>{const b=e.target.closest('[data-index]');if(!b||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();const from=Number(b.dataset.index),delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-columns,ArrowDown:columns};let next;if(e.key==='ArrowUp'||e.key==='ArrowDown'){const rows=getRows(),row=rows.findIndex(r=>r.includes(from)),col=rows[row].indexOf(from),target=rows[row+(e.key==='ArrowUp'?-1:1)];next=target?target[Math.min(col,target.length-1)]:from;}else next=e.key==='Home'?0:e.key==='End'?tokens().length-1:Math.max(0,Math.min(tokens().length-1,from+delta[e.key]));if(e.shiftKey){choose(range(Math.min(anchor,next),Math.max(anchor,next)+1));$('readingGrid').querySelector(`[data-index="${next}"]`)?.focus();}else{anchor=next;choose([next],true);}});
$('senseList').addEventListener('click',e=>{const b=e.target.closest('[data-sense]');if(!b)return;draft().sense=Number(b.dataset.sense);const candidate=selectedData().senses[draft().sense];if(candidate.reading)draft().reading=candidate.reading;renderInspector();});$('readingInput').addEventListener('input',e=>{draft().reading=e.target.value;status();});
function save(){if(selectedData().multi)return;const next={...records,[recordKey()]:{...draft()}};try{localStorage.setItem(storageKey,JSON.stringify(next));records=next;delete drafts[recordKey()];renderGrid();renderInspector();}catch{showToast('저장하지 못했습니다. 입력 내용은 유지됩니다.');}}
$('saveSelection').addEventListener('click',save);$('discardDraft').addEventListener('click',()=>{delete drafts[recordKey()];renderInspector();});$('clearMeaning').addEventListener('click',()=>{draft().sense=null;renderInspector();});
$('basicToggle').addEventListener('change',renderGrid);$('orderToggle').addEventListener('change',renderGrid);$('directToggle').addEventListener('change',renderDirect);
$('directRead').addEventListener('click',e=>{const b=e.target.closest('[data-segment]');if(b){const s=passage().segments[Number(b.dataset.segment)];choose([...s.indices]);$('readingGrid').querySelector(`[data-index="${s.indices[0]}"]`)?.scrollIntoView({block:'nearest',behavior:'auto'});}});
$('directRead').addEventListener('mouseover',e=>{const b=e.target.closest('[data-segment]');if(b){hoverIndices=passage().segments[Number(b.dataset.segment)].indices;highlight();}});$('directRead').addEventListener('mouseleave',()=>{hoverIndices=[];highlight();});
$('sidebarToggle').addEventListener('click',()=>{const hidden=document.body.classList.toggle('hide-sidebar');$('sidebarToggle').textContent=hidden?'목록 펼치기':'목록 접기';$('sidebarToggle').setAttribute('aria-expanded',String(!hidden));recalc();});
$('openInspector').addEventListener('click',()=>{$('inspector').classList.add('is-open');$('closeInspector').focus();});$('closeInspector').addEventListener('click',()=>{$('inspector').classList.remove('is-open');$('openInspector').focus();});
$('resetDemo').addEventListener('click',()=>{try{localStorage.removeItem(storageKey);}catch{}records={};drafts={};loadPassage(current);showToast('시연 예시로 되돌렸습니다.');});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}if(e.key==='Escape'){$('inspector').classList.remove('is-open');}});
new ResizeObserver(recalc).observe($('readingGrid'));loadPassage(0);
})();
</script>
</body></html>
