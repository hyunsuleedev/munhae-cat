const text=`骯髒六尺身，一落乾坤內。桑弧蓬矢射四方，男兒有膽如斗大。
況有狂風吹波濤，搖四海。蛟龍魚鼈皆未安，出穴動蕩失所在。
時無豪傑士，誰赴功名會。嗟哉我若匏瓜繫，揮斥難窮八極外。
長安塵土中，高枕臥五載。恆飢已變顏色黧，牢落枯腸千卷書。
及骭亦足溫，滿腹不願餘。可笑文章不直錢，萬乘何曾讀子虛。
紛紛世上鄙夫輩，舐痔猶得三十車。我欲唾面去，浩然賦歸歟。
休向閭閻老，一身如籠中鳥ㆍ池中魚。盡室萬里行，蕭蕭一疋驢。
家山急赴秋風至，蓴羹一杯方有味。遲遲回首望中原，可憐久作風波地。
黃鷄夜鳴非惡聲，起舞自有英雄志。誰言婦女不勝衣，長策雄謀人莫知。
作鎚誤擊秦，脫身遊下邳。從容跪授圯橋履，會須不後老人期。
笑彼拔山力，捕取等嬰兒。龍顏隆準一相遇，萬戶封侯帝者師。
丈夫事業固如是，何為乞米還遭嗤。一葦江之陽，歸來宿舂糧。
雲煙宛若畫，草樹巧如粧。浮家泛宅任平生，胸中自有無何鄕。
此行不是求為田，祇恐祖生先著鞭。感慨無言淚如洗，
茫茫鳥外空長天。匣中霜劍寒三尺，壯士有心終報國。`;

function save(){let x=data.find(x=>x.id===active);if(x&&dirty&&$('#definition')){x.definition=$('#definition').value;x.context=$('#context').value;dirty=false;$('#saved').textContent='저장됨'}}
function mobile(which){$('#workspace').classList.toggle('mobile-terms',which==='terms');$('#termTab').classList.toggle('on',which==='terms');$('#sourceTab').classList.toggle('on',which==='source')}
function renderSource(){const source=bodyText(),all=data.flatMap(spans),selected=data.find(x=>x.id===active),current=selected?spans(selected)[occurrence]:null;let offset=0;$('#source').innerHTML='<div class="bookhead"><h2 class="serif">杖劍行</h2><p>임춘 林椿 &nbsp; · &nbsp; '+($('#basis').value==='raw'?'원문':'표점본')+'</p></div>'+source.split('\n').map((line,i)=>{const begin=offset,end=offset+line.length;offset=end+1;const overlaps=all.filter(s=>s.start<end&&s.end>begin),cuts=[...new Set([begin,end,...overlaps.flatMap(s=>[Math.max(begin,s.start),Math.min(end,s.end)])])].sort((a,b)=>a-b);let html='';for(let j=0;j<cuts.length-1;j++){const a=cuts[j],b=cuts[j+1],cover=overlaps.filter(s=>s.start<=a&&s.end>=b);const value=esc(source.slice(a,b));if(!cover.length){html+=value;continue}const ids=[...new Set(cover.map(s=>s.id))],related=cover.some(s=>s.id===active),isCurrent=related&&current&&a>=current.start&&b<=current.end;html+=`<button type="button" class="hit ${related?'related':''} ${isCurrent?'current':''} ${ids.length>1?'overlap':''}" data-ids="${ids.join(',')}" data-start="${a}" aria-label="${esc(ids.map(id=>data.find(x=>x.id===id).form).join(' / '))} 용어 보기">${value}</button>`}return `<p class="source-line ${current&&current.start>=begin&&current.start<end?'focus-line':''}"><span class="linenum">${String(i+1).padStart(2,'0')}</span><span class="line-text serif">${html}</span></p>`}).join('');$('#sourceLabel').textContent=$('#basis').value==='raw'?'원문':'표점본';$('#sourceCount').textContent=Array.from(source.replace(/\s/g,'')).length+'자';const n=selected?spans(selected).length:0;$('#position').textContent=n?`${selected.form} · ${occurrence+1} / ${n}`:'등장 위치 없음';$('#prevHit').disabled=n<2||occurrence===0;$('#nextHit').disabled=n<2||occurrence===n-1}
function renderTerms(){const rows=shown();$('#terms').innerHTML=rows.map(x=>`<article class="card ${active===x.id?'active':''}" data-card="${x.id}"><button class="summary" data-open="${x.id}" aria-expanded="${active===x.id}"><div class="rowhead"><span class="term serif">${esc(x.form)}</span><span class="reading">${esc(x.reading)}</span><span class="kind">${esc(x.kind)}</span><span class="status">${x.status==='reviewed'?'✓':x.issue?'·':''}</span></div><div class="meaning">${esc(x.definition)}</div></button>${active===x.id?`<div class="detail"><div class="origin"><span class="pill">${x.status==='reviewed'?'검토됨':'검토 전'}</span><span>등장 ${spans(x).length}곳</span><button data-locate>원문 위치 ↗</button></div><label class="field"><span>뜻풀이</span><textarea id="definition" rows="2">${esc(x.definition)}</textarea></label><label class="field"><span>이 글에서의 풀이<small>선택</small></span><textarea id="context" rows="2" placeholder="필요한 문맥 정보만 적어 주세요.">${esc(x.context)}</textarea></label>${x.issue?`<p class="issue">확인할 점 · ${esc(x.issue)}</p>`:''}<details class="evidence"><summary>근거 보기</summary><p>${esc(x.evidence)}</p></details><div class="actions"><button class="quiet danger" data-remove>삭제</button><span class="savestate" id="saved">저장됨</span><button data-save>저장</button><button class="primary" data-review>${x.status==='reviewed'?'검토 전으로':'검토 완료'}</button></div></div>`:''}</article>`).join('')||'<p class="empty">조건에 맞는 용어가 없습니다.</p>';$('#total').textContent=data.length+'개';$('#progress').textContent=`${data.filter(x=>x.status==='reviewed').length} / ${data.length}개 검토됨`}
function locate(){const hit=$('#source .hit.current');if(hit)hit.scrollIntoView({block:'center',behavior:'instant'})}
function choose(id,start=null,fromSource=false){save();active=id;const term=data.find(x=>x.id===id),hits=spans(term);occurrence=start===null?0:Math.max(0,hits.findIndex(s=>start>=s.start&&start<s.end));if(fromSource){$('#search').value='';$('#filter').value='all'}renderSource();renderTerms();$('#chooser').hidden=true;if(!fromSource)locate();const card=$(`[data-card="${id}"]`);if(card)card.scrollIntoView({block:'nearest',behavior:'instant'});if(matchMedia('(max-width:620px)').matches)mobile('terms')}
$('#source').onclick=e=>{const b=e.target.closest('[data-ids]');if(!b)return;const ids=b.dataset.ids.split(',').map(Number),start=+b.dataset.start;if(ids.length===1){choose(ids[0],start,true);return}const box=$('#chooser');box.innerHTML='<p>이 구절에 연결된 용어</p>'+ids.map(id=>`<button data-choose="${id}" data-at="${start}">${esc(data.find(x=>x.id===id).form)}</button>`).join('');box.hidden=false;const r=b.getBoundingClientRect();box.style.left=Math.max(8,Math.min(r.left,innerWidth-285))+'px';box.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-box.offsetHeight-10))+'px';box.querySelector('button').focus()};$('#chooser').onclick=e=>{const b=e.target.closest('[data-choose]');if(b)choose(+b.dataset.choose,+b.dataset.at,true)};document.addEventListener('click',e=>{if(!e.target.closest('#chooser,[data-ids]'))$('#chooser').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#chooser').hidden=true});
$('#terms').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)choose(+b.dataset.open);if(b.hasAttribute('data-locate')){mobile('source');locate()}if(b.hasAttribute('data-save')){save();toast('뜻풀이를 저장했습니다.')}if(b.hasAttribute('data-review')){save();const x=data.find(x=>x.id===active);x.status=x.status==='draft'?'reviewed':'draft';renderTerms();toast('검토 상태를 변경했습니다.')}if(b.hasAttribute('data-remove')){save();deleted={data:structuredClone(data),active};data=data.filter(x=>x.id!==active);active=null;occurrence=0;renderSource();renderTerms();toast('용어를 삭제했습니다.',true)}};$('#terms').oninput=e=>{if(e.target.matches('textarea')){dirty=true;$('#saved').textContent='수정 중'}};
function step(d){const term=data.find(x=>x.id===active);if(!term)return;const n=spans(term).length;if(occurrence+d<0||occurrence+d>=n)return;occurrence+=d;renderSource();locate()}$('#prevHit').onclick=()=>step(-1);$('#nextHit').onclick=()=>step(1);$('#basis').onchange=()=>{save();occurrence=0;renderSource();renderTerms();locate()};$('#marks').onchange=e=>$('#source').classList.toggle('hide-marks',!e.target.checked);function filterRows(){save();renderTerms()}$('#search').oninput=filterRows;$('#filter').onchange=filterRows;$('#sourceTab').onclick=()=>mobile('source');$('#termTab').onclick=()=>mobile('terms');$('#undo').onclick=()=>{if(!deleted)return;save();data=deleted.data;active=deleted.active;occurrence=0;deleted=null;renderSource();renderTerms();toast('삭제를 되돌렸습니다.')};$('#reset').onclick=()=>{data=structuredClone(seed);active=1;occurrence=0;dirty=false;deleted=null;$('#search').value='';$('#filter').value='all';$('#basis').value='punct';$('#marks').checked=true;$('#source').classList.remove('hide-marks');$('#chooser').hidden=true;renderSource();renderTerms();$('#source').scrollTop=0;$('#terms').scrollTop=0;mobile('source');toast('데모를 초기화했습니다.')};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();toast('저장했습니다.')}if(e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();step(e.key==='ArrowLeft'?-1:1)}});renderSource();renderTerms();
</script></html>
