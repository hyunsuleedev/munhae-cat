<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문해 · 용어 검토 데모</title>
<style>
:root{--bg:#f4f3ef;--paper:#fffefa;--ink:#30362e;--muted:#81857b;--line:#e4e5dc;--accent:#51664b;--selected:#edf1e8;--warm:#a17242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px 13px}button:hover:not(:disabled){background:#eceee6}button:active:not(:disabled){transform:translateY(1px)}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover:not(:disabled){background:var(--accent)}.quiet{border-color:transparent;background:transparent}.danger{color:#995345}.serif{font-family:"Songti SC","Noto Serif CJK KR","Batang",serif}header{height:64px;display:flex;align-items:center;padding:0 30px;border-bottom:1px solid var(--line);gap:24px;background:var(--paper)}.brand{font-size:27px;letter-spacing:6px}.crumb{color:var(--muted);font-size:12px}.demo{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:26px 36px 20px}.steps{display:flex;gap:28px;color:var(--muted);font-size:12px;margin-bottom:24px}.steps .active{color:var(--ink);font-weight:600}.steps b{font-family:Georgia,serif;margin-right:8px;font-size:17px;font-weight:normal}.titlebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.titlebar h1{font-size:23px;letter-spacing:-.7px;font-weight:600;margin:0 0 4px}.titlebar p{margin:0;color:var(--muted);font-size:12px}.workspace{height:calc(100dvh - 252px);min-height:490px;display:grid;grid-template-columns:355px minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 20px #222b2010}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.searcharea{padding:18px 18px 12px}.search{position:relative}.search span{position:absolute;left:12px;top:7px;color:var(--muted);font-size:19px}.search input{width:100%;border:1px solid var(--line);border-radius:7px;background:#f8f8f3;padding:9px 12px 9px 37px;font-size:13px}.filters{display:flex;gap:5px;margin-top:13px}.filters button{font-size:12px;padding:5px 10px;border:none;background:transparent;color:var(--muted)}.filters button.on{background:var(--selected);color:var(--accent);font-weight:600}.batch{display:flex;align-items:center;gap:9px;padding:10px 20px;border-block:1px solid var(--line);height:46px;font-size:11px;color:var(--muted)}input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}.batch button{margin-left:auto;padding:3px 5px;font-size:11px}.list{overflow:auto;flex:1;padding:6px}.row{display:flex;border-radius:6px;align-items:center;padding-left:13px;position:relative;margin:2px 0}.row:hover{background:#f7f7f2}.row.selected{background:var(--selected)}.row.selected:before{content:"";position:absolute;left:0;height:27px;width:3px;border-radius:3px;background:var(--accent)}.row>button{flex:1;min-width:0;text-align:left;background:transparent;border:0;border-radius:0;padding:13px 12px}.row>button:hover{background:transparent}.rowhead{display:flex;align-items:center;gap:8px;margin-bottom:5px}.han{font-size:20px}.reading{font-size:11px;color:var(--muted)}.kind{margin-left:auto;color:var(--muted);font-size:10px}.preview{font-size:12px;color:#73786e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:5px;height:5px;border-radius:50%;background:var(--warm);display:inline-block;flex-shrink:0}.done{color:var(--accent);font-size:12px}.listfoot{padding:10px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.detail{min-width:0;display:flex;flex-direction:column;min-height:0}.detailtop{display:flex;justify-content:space-between;align-items:center;padding:17px 28px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.navbuttons{display:flex;align-items:center;gap:5px}.navbuttons button{padding:3px 9px;font-size:18px}.body{overflow:auto;flex:1;padding:26px 36px}.termhead{display:flex;gap:14px;align-items:baseline;margin-bottom:6px}.termhead h2{font-size:36px;font-weight:500;line-height:1.3;margin:0}.termhead span{color:var(--muted);font-size:13px}.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px;margin:8px 0 24px}.pill{border-radius:4px;padding:2px 6px;background:#f5efe5;color:var(--warm)}.pill.reviewed{background:var(--selected);color:var(--accent)}.quote{border-left:2px solid #bbc7b1;background:#f5f6f0;padding:14px 18px;margin-bottom:25px}.quote small{display:block;color:var(--muted);font-size:10px;margin-bottom:7px}.quote p{font-size:21px;line-height:1.8;margin:0}mark{background:#dee7d3;color:inherit;padding:2px 1px;border-radius:2px}.field{display:block;margin-bottom:22px}.field>span,.sectionlabel{font-size:12px;font-weight:600;display:block;margin-bottom:8px}.field .optional{font-weight:400;color:var(--muted);font-size:10px;margin-left:7px}textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:7px;padding:11px 12px;resize:vertical;min-height:72px;font-size:13px;line-height:1.85}textarea:hover{border-color:#c6cdbe}.note{border-top:1px solid var(--line);padding-top:19px}.note p{font-size:12px;line-height:1.9;margin:0;color:#77786d}.note+.note{margin-top:20px}.note.warn .sectionlabel{color:var(--warm)}.detailfoot{display:flex;align-items:center;gap:8px;padding:15px 28px;border-top:1px solid var(--line);background:var(--paper)}.saved{font-size:11px;color:var(--muted);margin-left:auto;margin-right:9px}.bottom{display:flex;justify-content:space-between;padding-top:12px;font-size:10px;color:var(--muted)}.empty{padding:50px 25px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;box-shadow:0 4px 20px #0002;display:flex;gap:20px;align-items:center;font-size:12px;z-index:5}.toast[hidden]{display:none}.toast button{border:0;background:transparent;padding:0;color:#d8e9c7;font-size:12px}.back{display:none}.mobile-count{display:none}@media(max-width:850px){main{padding:22px 18px}.workspace{grid-template-columns:290px minmax(0,1fr)}.body{padding:24px}.detailfoot{padding:14px}.titlebar p{max-width:380px}.crumb{display:none}}@media(max-width:620px){header{height:54px;padding:0 20px}main{padding:18px 12px}.steps{gap:15px;font-size:11px;margin-bottom:20px}.steps b{font-size:13px;margin-right:4px}.titlebar{align-items:flex-start;gap:10px}.titlebar h1{font-size:21px}.titlebar p{font-size:11px;max-width:220px}.titlebar button{font-size:11px;padding:8px}.workspace{height:calc(100dvh - 230px);min-height:450px;display:block}.sidebar{height:100%;border-right:0}.detail{display:none;height:100%}.workspace.show-detail .sidebar{display:none}.workspace.show-detail .detail{display:flex}.back{display:block}.detailtop{padding:12px 18px}.body{padding:20px}.bottom span:last-child{display:none}.termhead h2{font-size:30px}.detailfoot{gap:4px}.detailfoot button{padding:8px;font-size:12px}.saved{font-size:10px;margin-right:4px}.batch{font-size:12px}}
</style>
<header><span class="brand serif">文解</span><span class="crumb">우리나라 &nbsp; / &nbsp; 임춘의 〈장검행〉</span><span class="demo">UI 데모</span><button class="quiet" id="reset" title="데모 데이터 초기화">초기화 ↺</button></header>
<main><nav class="steps" aria-label="문서 단계"><span><b>01</b>원문 정리</span><span><b>02</b>표점</span><span class="active"><b>03</b>용어</span><span><b>04</b>번역·검토</span></nav><div class="titlebar"><div><h1>용어 검토</h1><p>필요한 용어를 남기고, 이 글에 맞는 뜻을 정리하세요.</p></div><button id="add">＋ 직접 추가</button></div>
<div class="workspace" id="workspace"><aside class="sidebar" aria-label="용어 목록"><div class="searcharea"><div class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="용어 검색" placeholder="용어·독음·뜻풀이 검색"></div><div class="filters" aria-label="상태 필터"><button data-filter="all" class="on">전체</button><button data-filter="draft">검토 전</button><button data-filter="reviewed">검토됨</button><button data-filter="issue">확인 필요</button></div></div><div class="batch"><input type="checkbox" id="all" aria-label="표시된 용어 모두 선택"><span id="selection">목록 전체 선택</span><button class="quiet danger" id="bulk" hidden>선택 삭제</button></div><div class="list" id="list"></div><div class="listfoot" id="count"></div></aside><section class="detail" id="detail" aria-label="용어 상세"></section></div><div class="bottom"><span>수정·삭제는 이 데모 안에서만 적용됩니다.</span><span>⌘ / Ctrl + S 저장 &nbsp; · &nbsp; Alt + ← → 항목 이동</span></div></main><div class="toast" id="toast" role="status" hidden><span id="toasttext"></span><button id="undo" hidden>되돌리기</button></div>
<script>
const seed=[
{id:1,form:'骯髒',reading:'항장',kind:'표현',definition:'기개가 높아 세속에 굽히지 않는 모양.',context:'현대어의 ‘더럽다’와 구분하여 읽는다.',quote:'骯髒六尺身，一落乾坤內。',issue:'강직함과 세상에 어울리지 못함 중 어느 뉘앙스를 강조할지 검토.',evidence:'아직 등록된 근거가 없습니다.',status:'draft'},
{id:2,form:'子虛',reading:'자허',kind:'작품',definition:'사마상여의 부 작품 〈자허부〉를 가리키는 약칭.',context:'',quote:'可笑文章不直錢，萬乘何曾讀子虛。',issue:'',evidence:'출전·근거를 추가할 수 있습니다.',status:'reviewed'},
{id:3,form:'龍顏隆準',reading:'용안융준',kind:'인물',definition:'용 같은 얼굴과 높은 코로 묘사된 인물을 가리키는 표현.',context:'장량의 행적을 다루는 앞뒤 구절과 함께 인물을 식별한다.',quote:'龍顏隆準一相遇，萬戶封侯帝者師。',issue:'한 고조 유방을 가리키는지 원전의 인물 묘사와 대조.',evidence:'제공된 해제는 이 대목을 장량과 한 고조의 만남으로 설명합니다.',status:'draft'},
{id:4,form:'中原',reading:'중원',kind:'장소',definition:'중국의 중심 지역을 가리키는 지리 표현.',context:'',quote:'遲遲回首望中原，可憐久作風波地。',issue:'이 글에서의 구체적인 지시 범위를 확인.',evidence:'아직 등록된 근거가 없습니다.',status:'draft'},
{id:5,form:'功名會',reading:'공명회',kind:'개념',definition:'공업과 명성을 이룰 수 있는 때나 계기.',context:'會를 모임이 아닌 기회라는 뜻으로 읽는다.',quote:'時無豪傑士，誰赴功名會。',issue:'',evidence:'앞 구절의 時와 연결하여 의미를 검토한 초안입니다.',status:'reviewed'},
{id:6,form:'捕取等嬰兒',reading:'포취등영아',kind:'표현',definition:'상대를 붙잡는 일이 어린아이를 붙잡는 것처럼 쉽다는 비교 표현.',context:'목적어를 앞 구절에서 보충하여 읽는지 검토한다.',quote:'笑彼拔山力，捕取等嬰兒。',issue:'等의 비교 용법과 포획의 대상을 확인.',evidence:'아직 등록된 근거가 없습니다.',status:'draft'},
{id:7,form:'祖生先著鞭',reading:'조생선착편',kind:'전고',definition:'조생이 먼저 채찍을 잡는다는 표현으로, 공업에서 앞서는 것을 비유한다.',context:'',quote:'此行不是求為田，祇恐祖生先著鞭。',issue:'조적·유곤의 일화와 표현의 대응 관계 확인.',evidence:'제공된 해제에 조적·유곤 관련 일화가 정리되어 있습니다.',status:'draft'},
{id:8,form:'盡室',reading:'진실',kind:'표현',definition:'집안 식구 전부.',context:'',quote:'盡室萬里行，蕭蕭一疋驢。',issue:'',evidence:'아직 등록된 근거가 없습니다.',status:'draft'},
{id:9,form:'下邳',reading:'하비',kind:'장소',definition:'장량의 피신과 노인과의 만남에 등장하는 중국의 옛 지명.',context:'',quote:'作鎚誤擊秦，脫身遊下邳。',issue:'',evidence:'제공된 해제의 장량 행적 설명.',status:'draft'},
{id:10,form:'無何鄕',reading:'무하향',kind:'전고',definition:'속박에서 벗어난 경지를 가리키는 표현.',context:'실제 지명과 구분한다.',quote:'浮家泛宅任平生，胸中自有無何鄕。',issue:'무하유지향과의 관련 및 생략 형태 확인.',evidence:'아직 등록된 근거가 없습니다.',status:'draft'}];
let data=structuredClone(seed),active=3,selected=new Set(),filter='all',dirty=false,deleted=null,timer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shown(){const q=$('#search').value.trim().toLowerCase();return data.filter(x=>(filter==='all'||filter==='issue'&&x.issue||x.status===filter)&&[x.form,x.reading,x.definition].some(s=>s.toLowerCase().includes(q)))}
function toast(text,undo=false){clearTimeout(timer);$('#toasttext').textContent=text;$('#undo').hidden=!undo;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,undo?10000:2600)}
function commit(){const x=data.find(x=>x.id===active);if(!x||!dirty)return;x.definition=$('#definition').value;x.context=$('#context').value;dirty=false;$('#saveState').textContent='저장됨';renderList()}
function renderList(){const items=shown();$('#list').innerHTML=items.map(x=>`<div class="row ${x.id===active?'selected':''}"><input type="checkbox" data-check="${x.id}" aria-label="${esc(x.form)} 선택" ${selected.has(x.id)?'checked':''}><button data-open="${x.id}" ${x.id===active?'aria-current="true"':''}><div class="rowhead"><span class="han serif">${esc(x.form)}</span><span class="reading">${esc(x.reading)}</span><span class="kind">${esc(x.kind)}</span>${x.status==='reviewed'?'<span class="done" title="검토됨" aria-label="검토됨">✓</span>':x.issue?'<i class="dot" title="확인 필요" aria-label="확인 필요"></i>':''}</div><div class="preview">${esc(x.definition||'뜻풀이를 작성하세요')}</div></button></div>`).join('')||'<div class="empty">조건에 맞는 용어가 없습니다.</div>';$('#selection').textContent=selected.size?`${selected.size}개 선택`:'목록 전체 선택';$('#bulk').hidden=!selected.size;const n=items.filter(x=>selected.has(x.id)).length;$('#all').checked=items.length>0&&n===items.length;$('#all').indeterminate=n>0&&n<items.length;$('#all').disabled=!items.length;$('#count').textContent=`${items.length}개 표시 · 전체 ${data.length}개 중 ${data.filter(x=>x.status==='reviewed').length}개 검토됨`;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('on',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))})}
function renderDetail(){const x=data.find(x=>x.id===active);if(!x){$('#detail').innerHTML='<div class="empty">목록에서 검토할 용어를 선택하세요.</div>';return}const items=shown(),i=items.findIndex(t=>t.id===active);$('#detail').innerHTML=`<div class="detailtop"><button class="quiet back" id="back">‹ 목록</button><span>이 문서의 용어 <span style="padding:0 8px;color:#c5c9bf">/</span> ${i+1} / ${items.length}</span><div class="navbuttons"><button id="prev" aria-label="이전 용어" ${i<=0?'disabled':''}>‹</button><button id="next" aria-label="다음 용어" ${i>=items.length-1?'disabled':''}>›</button></div></div><div class="body"><div class="termhead"><h2 class="serif">${esc(x.form)}</h2><span>${esc(x.reading)}</span></div><div class="meta"><span>${esc(x.kind)}</span><span>·</span><span class="pill ${x.status==='reviewed'?'reviewed':''}">${x.status==='reviewed'?'검토됨':'검토 전'}</span><span>AI 후보</span></div><div class="quote"><small>등장 구절 · 표점본</small><p class="serif">${esc(x.quote).split(esc(x.form)).join('<mark>'+esc(x.form)+'</mark>')}</p></div><label class="field"><span>뜻풀이</span><textarea id="definition" rows="2">${esc(x.definition)}</textarea></label><label class="field"><span>이 글에서의 풀이<span class="optional">선택</span></span><textarea id="context" rows="2" placeholder="정의에 없는 문맥이나 적용 조건이 있을 때만 적어 주세요.">${esc(x.context)}</textarea></label>${x.issue?`<div class="note warn"><span class="sectionlabel">확인할 점</span><p>${esc(x.issue)}</p></div>`:''}<div class="note"><span class="sectionlabel">근거</span><p>${esc(x.evidence)}</p></div></div><footer class="detailfoot"><button class="quiet danger" id="remove" aria-label="현재 용어 삭제">삭제</button><span class="saved" id="saveState">저장됨</span><button id="save">저장</button><button class="primary" id="review">${x.status==='reviewed'?'검토 전으로':'검토 완료'}</button></footer>`}
function render(){renderList();renderDetail()}
function open(id){commit();active=id;render();$('#workspace').classList.add('show-detail')}
function move(d){const items=shown(),i=items.findIndex(x=>x.id===active);if(items[i+d])open(items[i+d].id)}
function remove(ids){commit();deleted={data:structuredClone(data),active};data=data.filter(x=>!ids.includes(x.id));ids.forEach(id=>selected.delete(id));if(ids.includes(active))active=shown()[0]?.id;render();toast(`${ids.length}개 용어를 삭제했습니다.`,true)}
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(+b.dataset.open)});$('#list').addEventListener('change',e=>{const id=+e.target.dataset.check;if(e.target.checked)selected.add(id);else selected.delete(id);renderList()});$('#all').onchange=e=>{shown().forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id));renderList()};$('#bulk').onclick=()=>remove([...selected]);$('#undo').onclick=()=>{if(deleted){data=deleted.data;active=deleted.active;deleted=null;render();toast('삭제를 되돌렸습니다.')}};
$('#search').oninput=()=>{commit();selected.clear();if(!shown().some(x=>x.id===active))active=shown()[0]?.id;render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{commit();filter=b.dataset.filter;selected.clear();if(!shown().some(x=>x.id===active))active=shown()[0]?.id;render()});$('#detail').addEventListener('input',e=>{if(e.target.matches('textarea')){dirty=true;$('#saveState').textContent='수정 중'}});$('#detail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='back'){$('#workspace').classList.remove('show-detail');commit()}if(b.id==='prev')move(-1);if(b.id==='next')move(1);if(b.id==='save'){commit();toast('뜻풀이를 저장했습니다.')}if(b.id==='remove')remove([active]);if(b.id==='review'){commit();const x=data.find(x=>x.id===active);x.status=x.status==='reviewed'?'draft':'reviewed';if(!shown().some(x=>x.id===active))active=shown()[0]?.id;render();toast('검토 상태를 변경했습니다.')}});
$('#reset').onclick=()=>{data=structuredClone(seed);active=3;filter='all';selected.clear();dirty=false;deleted=null;$('#search').value='';$('#toast').hidden=true;render();toast('처음 상태로 돌아왔습니다.')};$('#add').onclick=()=>{const form=prompt('추가할 원문 표현을 입력하세요.');if(!form?.trim())return;commit();const id=Date.now();data.push({id,form:form.trim(),reading:'',kind:'표현',definition:'',context:'',quote:form.trim(),issue:'',evidence:'아직 등록된 근거가 없습니다.',status:'draft'});filter='all';$('#search').value='';open(id);$('#definition').focus()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();commit();toast('저장했습니다.')}if(e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}});render();
</script></html>
